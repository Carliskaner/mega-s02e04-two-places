name: S02E04 Remote Job 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund --silent

      - name: Test receipt encryption
        run: npm test --prefix worker

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.112 --no-audit --no-fund --silent

      - name: Prepare isolated Copilot configuration
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node worker/prepare-copilot-config.mjs

      - name: Run remote agent
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          MEGA_JOB_MCP_URL: ${{ secrets.JOB_2_MCP_URL }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node worker/run-agent.mjs

      - name: Encrypt result
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [ ! -f "$RUNNER_TEMP/job2-result.json" ]; then
            echo 'Encrypted result was not produced.'
            exit 1
          fi
          node worker/receipt-crypto.mjs encrypt "$RUNNER_TEMP/job2-result.json" worker/receipt-key.pub.pem "$RUNNER_TEMP/job2-result.enc"

      - name: Remove plaintext result
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: rm -f "$RUNNER_TEMP/job2-result.json"

      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s02e04-job-2-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/job2-result.enc
          retention-days: 7
          if-no-files-found: ignore
